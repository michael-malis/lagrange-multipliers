name: Verify and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Preserve offline standalone build for independent QA
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ github.sha }}
          path: dist/index.html
          retention-days: 14
      - name: Run bounded Playwright regression suite
        run: timeout 14m npm run test:browser
      - name: Install Firefox and WebKit for offline cross-engine smoke
        run: npx playwright install --with-deps firefox webkit
      - name: Verify self-contained HTML in Firefox and WebKit
        run: node scripts/cross-browser-smoke.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published version and interactions
        run: npm run test:public
        env:
          EXPECTED_SHA: ${{ github.sha }}
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 14
