name: Verify PR 3 without deployment
on:
  push:
    branches:
      - ci/verify-pr3-20261107
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright regression suite
        run: timeout 14m npm run test:browser
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Cross-engine offline smoke
        run: node scripts/cross-browser-smoke.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr3-browser-evidence
          path: test-results/
          retention-days: 5
