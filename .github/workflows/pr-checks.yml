name: Pull request quality checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run complete browser regression
        run: timeout 14m npm run test:browser
      - run: npx playwright install --with-deps firefox webkit
      - name: Cross-browser offline verification
        run: node scripts/cross-browser-smoke.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pull-request-browser-evidence
          path: test-results/
          retention-days: 7
